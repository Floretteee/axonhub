name: Publish Docker image (unstable)

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build. The sync workflow passes its post-sync commit.
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-unstable
  cancel-in-progress: false

jobs:
  compute-version:
    name: Compute unstable version
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.build_version }}
      date_tag: ${{ steps.version.outputs.date_tag }}
      sha_tag: ${{ steps.version.outputs.sha_tag }}
      owner_lc: ${{ steps.version.outputs.owner_lc }}
      actor_lc: ${{ steps.version.outputs.actor_lc }}
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Compute version and image owner
        id: version
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          ACTOR_LC="${GITHUB_ACTOR,,}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y%m%d)"
          SHORT_SHA="${COMMIT_SHA:0:12}"
          BUILD_VERSION="unstable-${DATE}-${SHORT_SHA}"
          DATE_TAG="unstable-${DATE}"
          SHA_TAG="unstable-${SHORT_SHA}"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "actor_lc=${ACTOR_LC}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "date_tag=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push (${{ matrix.arch }})
    needs: [compute-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Write build version
        run: printf '%s\n' '${{ needs.compute-version.outputs.build_version }}' > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ needs.compute-version.outputs.actor_lc }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ needs.compute-version.outputs.owner_lc }}/axonhub:${{ needs.compute-version.outputs.date_tag }}-${{ matrix.arch }}
            ghcr.io/${{ needs.compute-version.outputs.owner_lc }}/axonhub:${{ needs.compute-version.outputs.sha_tag }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create-manifest:
    name: Create multi-arch manifests
    needs: [compute-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ needs.compute-version.outputs.actor_lc }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push date manifest
        run: |
          IMAGE="ghcr.io/${{ needs.compute-version.outputs.owner_lc }}/axonhub"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.compute-version.outputs.date_tag }}" \
            "${IMAGE}:${{ needs.compute-version.outputs.date_tag }}-amd64" \
            "${IMAGE}:${{ needs.compute-version.outputs.date_tag }}-arm64"

      - name: Create and push commit manifest
        run: |
          IMAGE="ghcr.io/${{ needs.compute-version.outputs.owner_lc }}/axonhub"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.compute-version.outputs.sha_tag }}" \
            "${IMAGE}:${{ needs.compute-version.outputs.sha_tag }}-amd64" \
            "${IMAGE}:${{ needs.compute-version.outputs.sha_tag }}-arm64"

      - name: Move unstable manifest tag
        run: |
          IMAGE="ghcr.io/${{ needs.compute-version.outputs.owner_lc }}/axonhub"
          docker buildx imagetools create \
            -t "${IMAGE}:unstable" \
            "${IMAGE}:${{ needs.compute-version.outputs.sha_tag }}-amd64" \
            "${IMAGE}:${{ needs.compute-version.outputs.sha_tag }}-arm64"
